<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes III HotA - Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo">⚔️</div>
        <h1>Discord Heroes III HotA</h1>
        <p>Žebříček šampionů a válečníků</p>
    </div>

    <!-- HORNÍ KARTY (Všechny 3 karty v jednom bloku) -->
    <div class="top-cards">
        <!-- 1. Trvalý Šampion minulého ročníku -->
        <div class="card" style="border-color: #f1c40f; background: linear-gradient(135deg, rgba(241,196,15,0.15), rgba(20,21,26,0.9));">
            <div class="title" style="color: #f1c40f;">👑 Šampion Sezóny 1</div>
            <div class="value" style="color: #f1c40f; text-shadow: 0 0 10px rgba(241,196,15,0.5);">Honza</div>
        </div>

        <!-- 2. Aktuální lídr v živé tabulce -->
        <div class="card">
            <div class="title">⚔️ Průběžný Lídr Sezóny</div>
            <div class="value" id="top-player">-</div>
        </div>

        <!-- 3. Celkem odehraných zápasů -->
        <div class="card">
            <div class="title">🎮 Celkem Odehraných Zápasů</div>
            <div class="value" id="total-games">-</div>
        </div>
    </div>

    <!-- PŘEPÍNAČ REŽIMŮ (PvP / Singleplayer) -->
    <div class="leaderboard-toggle">
        <button class="toggle-btn active" id="btn-pvp" onclick="switchMode('pvp')">
            ⚔️ PvP Žebříček
        </button>
        <button class="toggle-btn" id="btn-pve" onclick="switchMode('pve')">
            🤖 Singleplayer (PvE)
        </button>
    </div>

    <div class="leaderboard-title">
        🏆 Síň slávy
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Hráč</th>
                    <th>Výhry (1st)</th>
                    <th>Bedna (TOP 3)</th>
                    <th>Zápasy</th>
                    <th>Prohry</th>
                    <th>Winrate</th>
                    <th>Liga</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr>
                    <td colspan="8">
                        Načítám data z Google Sheets...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        Synchronizováno s Google Tabulkou
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
